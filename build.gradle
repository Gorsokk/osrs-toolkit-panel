plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'
	testCompileOnly 'org.projectlombok:lombok:1.18.30'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.gorsok'
version = '0.1.0'

// Author's dev setup only: if OSRS Toolkit Exporter sits next to this project (folder osrs-toolkit-exporter,
// or its old name position-exporter), `runClient` starts the whole suite: Panel + Exporter.
def exporterSrc = ['../osrs-toolkit-exporter', '../position-exporter']
	.collect { file("${it}/src/main/java") }.find { it.exists() }
def withPositionExporter = exporterSrc != null
if (withPositionExporter) {
	sourceSets.test.java.srcDirs exporterSrc, 'src/dev/java'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('runClient', JavaExec) {
	group = 'application'
	description = 'Starts a RuneLite dev client with this plugin (and OSRS Toolkit Exporter when it sits next to it)'
	mainClass = withPositionExporter
		? 'com.gorsok.toolkitpanel.DevLauncher'
		: 'com.gorsok.toolkitpanel.ToolkitPanelPluginTest'
	classpath = sourceSets.test.runtimeClasspath
	jvmArgs = ['-ea']
	standardInput = System.in
}
